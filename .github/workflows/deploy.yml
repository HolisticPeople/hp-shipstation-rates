name: Deploy HP ShipStation Rates to Kinsta

# Canonical two-job shape (C:\DEV\CLAUDE.md "CI / workflows", 2026-10-31
# side-findings sweep): the staging job runs on a dev push OR a staging
# dispatch; the production job runs ONLY on a production dispatch. The staging
# auto-trigger is scoped to push events so a production dispatch from the dev
# ref never also deploys staging.

on:
  push:
    branches:
      - dev   # Auto-deploy to staging on push to dev
      # master branch does NOT auto-deploy to production (manual only)
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      ignore_staging_leases:
        description: Deploy even if an active staging QA lease names hp-shipstation-rates (staging only; production never checks leases)
        required: false
        default: false
        type: boolean

env:
  PLUGIN_SLUG: hp-shipstation-rates
  # Dev-only paths listed in .github/deploy-exclude.txt. rsync runs without
  # --delete, so copies left by older deploys are removed explicitly after
  # each rsync to keep tests/docs out of the served plugin tree.
  DEV_ONLY_PATHS: tests docs .cursor

jobs:
  deploy-staging:
    if: |
      (github.event_name == 'push' && github.ref_name == 'dev') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    name: Deploy to STAGING
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.KINSTA_HOST }}
      SSH_PORT: ${{ secrets.KINSTA_PORT }}
      SSH_USER: ${{ secrets.KINSTA_USER }}
      PLUGINS_BASE: ${{ secrets.KINSTA_PLUGINS_BASE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Test staging lease check
        run: python3 -B .github/hp-deploy/staging-lease-check-test.py

      # P4/P4b (2026-10-30): a lane mid-browser-QA books a lease naming the
      # plugins its QA measures (HP-Codex-Skills staging-lease.py). Wait for
      # unexpired leases naming hp-shipstation-rates; missing directory = free; SSH error =
      # fail closed. Leases from other plugins never block this deploy.
      - name: Respect active staging leases
        env:
          IGNORE_STAGING_LEASES: ${{ github.event_name == 'workflow_dispatch' && inputs.ignore_staging_leases == true }}
          KINSTA_HOST: ${{ secrets.KINSTA_HOST }}
          KINSTA_PORT: ${{ secrets.KINSTA_PORT }}
          KINSTA_USER: ${{ secrets.KINSTA_USER }}
          KINSTA_SSH_KEY: ${{ secrets.KINSTA_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ "$IGNORE_STAGING_LEASES" == "true" ]]; then
            echo "::warning::ignore_staging_leases=true: deploying without checking staging leases"
            exit 0
          fi
          lease_tmp="$(mktemp -d)"
          trap 'rm -rf "$lease_tmp"' EXIT
          printf '%s\n' "$KINSTA_SSH_KEY" > "$lease_tmp/key"
          chmod 600 "$lease_tmp/key"
          if ! ssh-keyscan -p "${KINSTA_PORT:-22}" "${KINSTA_HOST}" > "$lease_tmp/known_hosts" 2> "$lease_tmp/keyscan.err" || [[ ! -s "$lease_tmp/known_hosts" ]]; then
            echo "::error::Staging lease check could not reach the staging host (ssh-keyscan): $(tail -c 500 "$lease_tmp/keyscan.err")"
            exit 1
          fi
          set +e
          ssh -i "$lease_tmp/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$lease_tmp/known_hosts" \
            -o ConnectTimeout=20 -p "${KINSTA_PORT:-22}" "${KINSTA_USER}@${KINSTA_HOST}" \
            "python3 - --plugin hp-shipstation-rates" < .github/hp-deploy/staging-lease-check.py \
            > "$lease_tmp/out.json" 2> "$lease_tmp/err.txt"
          rc=$?
          set -e
          cat "$lease_tmp/out.json"
          case "$rc" in
            0)
              echo "No active staging lease names hp-shipstation-rates; deploying."
              ;;
            3)
              python3 - "$lease_tmp/out.json" <<'PY'
          import json, sys
          for lease in json.load(open(sys.argv[1]))["blocking"]:
              print("::error::" + lease["message"])
          PY
              echo "::error::hp-shipstation-rates is leased for browser QA on staging. Re-run after the lease expires or is released, or dispatch with ignore_staging_leases=true."
              exit 1
              ;;
            *)
              echo "::error::Staging lease check failed closed (exit $rc): $(tail -c 500 "$lease_tmp/err.txt")"
              exit 1
              ;;
          esac

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.KINSTA_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/kinsta_key
          chmod 600 ~/.ssh/kinsta_key

          # Verify key format
          echo "Verifying SSH key format..."
          head -1 ~/.ssh/kinsta_key
          tail -1 ~/.ssh/kinsta_key

          # Add host to known_hosts
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test SSH connection
        run: |
          echo "Testing SSH connection to staging..."
          ssh -i ~/.ssh/kinsta_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST" \
            "echo 'SSH connection successful!'"

      - name: Backup existing plugin (if exists)
        run: |
          PLUGIN_PATH="$PLUGINS_BASE/$PLUGIN_SLUG"

          echo "Checking for existing plugin at: $PLUGIN_PATH"

          ssh -i ~/.ssh/kinsta_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "if [ -d '$PLUGIN_PATH' ]; then cp -rn '$PLUGIN_PATH' '$PLUGIN_PATH.bak.$(date +%Y%m%d-%H%M%S)'; echo 'Backup created'; else echo 'No existing plugin to backup'; fi"

      - name: Rsync plugin files
        run: |
          set -euo pipefail
          PLUGIN_PATH="$PLUGINS_BASE/$PLUGIN_SLUG"

          echo "Deploying to: staging"
          echo "Target path: $PLUGIN_PATH"

          # Create plugin directory if it doesn't exist
          ssh -i ~/.ssh/kinsta_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$PLUGIN_PATH'"

          # Deploy files using rsync (NO --delete to prevent accidental deletion)
          rsync -avz \
            -e "ssh -i ~/.ssh/kinsta_key -p $SSH_PORT" \
            --exclude-from='.github/deploy-exclude.txt' \
            ./ "$SSH_USER@$SSH_HOST:$PLUGIN_PATH/"

          echo "✅ Deployment to staging complete!"

      - name: Remove dev-only paths from deployed tree
        run: |
          set -euo pipefail
          PLUGIN_PATH="$PLUGINS_BASE/$PLUGIN_SLUG"
          for rel in $DEV_ONLY_PATHS; do
            grep -qxF "$rel/" .github/deploy-exclude.txt || { echo "::error::$rel/ is not in .github/deploy-exclude.txt"; exit 1; }
          done
          ssh -i ~/.ssh/kinsta_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "set -e; cd '$PLUGIN_PATH'; for rel in $DEV_ONLY_PATHS; do if [ -e \"\$rel\" ]; then rm -rf -- \"\$rel\"; echo \"removed \$rel\"; fi; done"

      - name: Flush caches
        run: |
          echo "Flushing WordPress caches..."

          ssh -i ~/.ssh/kinsta_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$PLUGINS_BASE/../..' && wp cache flush --allow-root && wp transient delete --all --allow-root || true"

          echo "✅ Cache flush complete!"

      # Kinsta's page/CDN cache serves stale HTML+JS past a plain `wp cache
      # flush`; a skipped purge left stale JS live after a 2026-07-27 deploy.
      - name: Purge Kinsta page cache
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/kinsta_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$PLUGINS_BASE/../..' && wp kinsta cache purge --all"
          echo "Kinsta page cache purged after staging deploy"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/kinsta_key

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    name: Deploy to PRODUCTION
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.KINSTAPROD_HOST }}
      SSH_PORT: ${{ secrets.KINSTAPROD_PORT }}
      SSH_USER: ${{ secrets.KINSTAPROD_USER }}
      PLUGINS_BASE: ${{ secrets.KINSTAPROD_PLUGINS_BASE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.KINSTAPROD_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/kinsta_key
          chmod 600 ~/.ssh/kinsta_key

          # Verify key format
          echo "Verifying SSH key format..."
          head -1 ~/.ssh/kinsta_key
          tail -1 ~/.ssh/kinsta_key

          # Add host to known_hosts
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test SSH connection
        run: |
          echo "Testing SSH connection to production..."
          ssh -i ~/.ssh/kinsta_key -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST" \
            "echo 'SSH connection successful!'"

      - name: Backup existing plugin (if exists)
        run: |
          PLUGIN_PATH="$PLUGINS_BASE/$PLUGIN_SLUG"

          echo "Checking for existing plugin at: $PLUGIN_PATH"

          ssh -i ~/.ssh/kinsta_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "if [ -d '$PLUGIN_PATH' ]; then cp -rn '$PLUGIN_PATH' '$PLUGIN_PATH.bak.$(date +%Y%m%d-%H%M%S)'; echo 'Backup created'; else echo 'No existing plugin to backup'; fi"

      - name: Rsync plugin files
        run: |
          set -euo pipefail
          PLUGIN_PATH="$PLUGINS_BASE/$PLUGIN_SLUG"

          echo "Deploying to: production"
          echo "Target path: $PLUGIN_PATH"

          # Create plugin directory if it doesn't exist
          ssh -i ~/.ssh/kinsta_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p '$PLUGIN_PATH'"

          # Deploy files using rsync (NO --delete to prevent accidental deletion)
          rsync -avz \
            -e "ssh -i ~/.ssh/kinsta_key -p $SSH_PORT" \
            --exclude-from='.github/deploy-exclude.txt' \
            ./ "$SSH_USER@$SSH_HOST:$PLUGIN_PATH/"

          echo "✅ Deployment to production complete!"

      - name: Remove dev-only paths from deployed tree
        run: |
          set -euo pipefail
          PLUGIN_PATH="$PLUGINS_BASE/$PLUGIN_SLUG"
          for rel in $DEV_ONLY_PATHS; do
            grep -qxF "$rel/" .github/deploy-exclude.txt || { echo "::error::$rel/ is not in .github/deploy-exclude.txt"; exit 1; }
          done
          ssh -i ~/.ssh/kinsta_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "set -e; cd '$PLUGIN_PATH'; for rel in $DEV_ONLY_PATHS; do if [ -e \"\$rel\" ]; then rm -rf -- \"\$rel\"; echo \"removed \$rel\"; fi; done"

      - name: Flush caches
        run: |
          echo "Flushing WordPress caches..."

          ssh -i ~/.ssh/kinsta_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$PLUGINS_BASE/../..' && wp cache flush --allow-root && wp transient delete --all --allow-root || true"

          echo "✅ Cache flush complete!"

      # Kinsta's page/CDN cache serves stale HTML+JS past a plain `wp cache
      # flush`; a skipped purge left stale JS live after a 2026-07-27 deploy.
      - name: Purge Kinsta page cache
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/kinsta_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd '$PLUGINS_BASE/../..' && wp kinsta cache purge --all"
          echo "Kinsta page cache purged after production deploy"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/kinsta_key
